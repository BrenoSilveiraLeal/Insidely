services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insidely
    ports:
      - "5432:5432"
    volumes:
      - insidely_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insidely"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  insidely_postgres_data:
